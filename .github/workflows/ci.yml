name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (offline lane + dev + editable pkg)
        run: pip install -r data-pipeline/requirements.txt -r requirements-dev.txt
      - name: Lint
        run: ruff check data-pipeline tests scripts frontend/scripts manuscripts
      - name: Tests
        run: pytest
      - name: CONTRACT 2, closed artifact inventory
        run: python scripts/check_artifacts.py
      - name: Docs links resolve inside the repo and every document is reachable
        run: python scripts/check_docs_links.py
      - name: Headline artifacts match the published figures
        # The two artifacts carrying the public headline numbers (the published-scenario CPIT gap
        # and the reproduced MineLib optima) were covered by no gate at all; deleting both left the
        # contract check printing OK. This also reconciles the README prose against the artifacts.
        run: python scripts/check_headline_artifacts.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Engine tests (exact ultimate-pit oracle + nested-shell monotonicity)
        run: npm test
      - name: Install browser for production UI contracts
        run: npx playwright install --with-deps chromium
      - name: Responsive, locale, accessibility and degraded-capability checks
        run: npm run test:e2e
      - name: Regenerate deterministic Contract-2 artifacts
        run: |
          npm run bake
          python ../data-pipeline/run.py all
          python ../scripts/check_artifacts.py
          git diff --exit-code -- ../data/derived
      - name: Type-check + build the SPA
        run: npm run build

  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Base-integrity guards (the regressions this archetype forbids)
        run: |
          fail=0
          # a real .env must never be tracked (only .env.example)
          if git ls-files | grep -qE '(^|/)\.env(\..+)?$' && ! git ls-files | grep -qx '.env.example'; then
            echo "::error::a real .env is tracked (only .env.example may be)"; fail=1; fi
          # venvs / native binaries / heavy model blobs must never be tracked
          if git ls-files | grep -qiE '(^|/)\.?venv|\.(dll|so|dylib|pt|pth)$'; then
            echo "::error::a venv or native/heavy binary is tracked (recreate from requirements; keep models small/LFS)"; fail=1; fi
          # raw/heavy data must never be tracked, commit only compact derived artifacts under data/derived/
          if git ls-files | grep -qiE '\.(parquet|h5|hdf5|nc|mat|npy)$'; then
            echo "::error::raw/heavy data tracked, commit only compact derived artifacts (data/derived/)"; fail=1; fi
          # no leaked local machine paths in tracked sources
          if git grep -nF 'D:\_Repos' -- . ':!.github' >/dev/null 2>&1; then
            echo "::error::leaked local machine path (D:\\_Repos) in a tracked file"; fail=1; fi
          if [ "$fail" -eq 0 ]; then echo "guards: OK"; fi
          exit $fail
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: No em-dash or emoji in product content (ADR-0067)
        run: python scripts/check_content_standards.py
      - name: Release and manifest version coherence
        run: python scripts/check_version_coherence.py
      - name: Scientific references, licenses and CPIT scenario integrity
        run: python scripts/check_reference_integrity.py
